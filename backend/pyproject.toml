[project]
name = "photo-copilot-backend"
version = "0.1.0"
description = "Image reference retrieval and technique diversity reranking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pydantic>=2,<3",
    "python-multipart>=0.0.20,<1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photocopilot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
